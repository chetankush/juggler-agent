<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round" width="24" height="24">
  <!-- Outer ring representing a sync/orbit -->
  <circle cx="12" cy="12" r="9" stroke-opacity="0.6"/>
  <!-- Central node -->
  <circle cx="12" cy="12" r="2.5" fill="currentColor" stroke="none"/>
  <!-- Three task lines (represents tasks in a list) -->
  <line x1="7" y1="6.5" x2="17" y2="6.5" stroke-opacity="0.8"/>
  <line x1="7" y1="9.5" x2="14" y2="9.5" stroke-opacity="0.6"/>
  <!-- Check mark (represents completion/alignment) -->
  <polyline points="8,16 11,19 16,13" stroke-width="2" stroke-opacity="0.9"/>
</svg>
